name: Update GitHub Cache

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'index.html'

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GitHub data and write encrypted cache
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          USER="Aswanidev-vs"
          GQL="https://api.github.com/graphql"
          REST="https://api.github.com"

          GQL_QUERY='query($login: String!) {
            user(login: $login) {
              login name avatarUrl bio location
              followers { totalCount }
              repositories(first: 100, privacy: PUBLIC, isFork: false, orderBy: {field: UPDATED_AT, direction: DESC}, ownerAffiliations: OWNER) {
                totalCount
                nodes {
                  name description url homepageUrl pushedAt createdAt
                  stargazerCount forkCount isFork
                  primaryLanguage { name color }
                  languages(first: 10) { edges { size node { name color } } }
                  licenseInfo { spdxId }
                  releases(first: 1, orderBy: {field: CREATED_AT, direction: DESC}) {
                    nodes { tagName publishedAt createdAt url }
                  }
                }
              }
              forkedRepositories: repositories(first: 1, privacy: PUBLIC, isFork: true, ownerAffiliations: OWNER) {
                totalCount
              }
            }
          }'

          # GraphQL call → write to file
          curl -s -H "Authorization: token $GH_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$GQL_QUERY" --arg login "$USER" '{query: $q, variables: {login: $login}}')" \
            "$GQL" > /tmp/gql_result.json

          # Extract user data → file
          jq '{
            login: .data.user.login,
            name: .data.user.name,
            avatar_url: .data.user.avatarUrl,
            bio: .data.user.bio,
            location: .data.user.location,
            followers: .data.user.followers.totalCount,
            public_repos: .data.user.repositories.totalCount,
            forked_repos: .data.user.forkedRepositories.totalCount
          }' /tmp/gql_result.json > /tmp/user_data.json

          # Extract repos data → file
          jq '[.data.user.repositories.nodes[] | {
            name: .name,
            description: .description,
            html_url: .url,
            homepage: .homepageUrl,
            pushed_at: .pushedAt,
            created_at: .createdAt,
            stargazers_count: .stargazerCount,
            forks_count: .forkCount,
            fork: .isFork,
            language: .primaryLanguage.name,
            primaryLanguage: .primaryLanguage,
            languages: .languages,
            license: (if .licenseInfo then {spdx_id: .licenseInfo.spdxId} else null end),
            releases: .releases
          }]' /tmp/gql_result.json > /tmp/repos_data.json

          # Extract language bytes → file
          jq '[
            .data.user.repositories.nodes[] | .languages.edges[]? | {name: .node.name, size: .size}
          ] | group_by(.name) | map({key: .[0].name, value: (map(.size) | add)}) | from_entries' \
            /tmp/gql_result.json > /tmp/lang_bytes.json

          # Fetch activity (3 pages) → file-based merging
          echo "[]" > /tmp/activity_combined.json
          for PAGE in 1 2 3; do
            curl -s -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
              "$REST/users/$USER/events/public?per_page=30&page=$PAGE" > /tmp/activity_page.json
            jq -s 'add' /tmp/activity_combined.json /tmp/activity_page.json > /tmp/activity_combined.json.tmp
            mv /tmp/activity_combined.json.tmp /tmp/activity_combined.json
          done

          # Extract releases → file
          jq '[.data.user.repositories.nodes[] | select(.releases.nodes[0]) | {
            name: .name,
            tag: .releases.nodes[0].tagName,
            date: (.releases.nodes[0].publishedAt // .releases.nodes[0].createdAt),
            url: .releases.nodes[0].url
          }] | sort_by(-(.date | fromdateiso8601))' /tmp/gql_result.json > /tmp/releases.json

          # Build cache from files using jq --slurpfile
          TIMESTAMP=$(date +%s%3N)
          jq -n \
            --argjson ts "$TIMESTAMP" \
            --slurpfile user /tmp/user_data.json \
            --slurpfile repos /tmp/repos_data.json \
            --slurpfile activity /tmp/activity_combined.json \
            --slurpfile releases /tmp/releases.json \
            --slurpfile langs /tmp/lang_bytes.json \
            '{ts: $ts, user: $user[0], repos: $repos[0], activity: $activity[0], releases: $releases[0], languageBytes: $langs[0]}' \
            > /tmp/cache.json

          # Encode and write
          ENCODED=$(base64 -w0 /tmp/cache.json | rev)
          jq -n --arg d "$ENCODED" --arg v "1" '{v: $v, d: $d}' > cache.json

          echo "Cache updated at $(date -u)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache.json
          git diff --cached --quiet || git commit -m "chore: update GitHub cache [skip ci]" && git push
