<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aswanidev VS | Projects</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c0c0e;
      --surface: #141416;
      --surface-hover: #1c1c1f;
      --border: #26262b;
      --border-bright: #363640;
      --amber: #e5a035;
      --amber-glow: rgba(229,160,53,0.12);
      --cream: #f0ece4;
      --muted: #7a7670;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Manrope', sans-serif;
      --serif: 'Instrument Serif', serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--cream);
      font-family: var(--sans);
      line-height: 1.7;
      background-image: radial-gradient(rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    a { color: inherit; text-decoration: none; transition: all .25s; }

    .container { max-width: 1040px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 48px); }

    nav { padding: 28px 0; }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: var(--mono); font-weight: 500; font-size: 24px; color: var(--amber); }
    .nav-links { display: flex; gap: 32px; font-size: 13px; color: var(--muted); }
    .nav-links a:hover { color: var(--cream); }

    .hero { padding: 100px 0 60px; text-align: center; position: relative; }
    .hero::before {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 400px; height: 400px; background: radial-gradient(circle, var(--amber-glow) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }
    .hero-content { position: relative; z-index: 1; }
    .hero h1 { font-family: var(--serif); font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 400; margin-bottom: 16px; }
    .hero h1 em { font-style: italic; color: var(--amber); }
    .hero p { color: var(--muted); max-width: 500px; margin: 0 auto; }

    .section-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 32px; }
    .section-head h2 { font-family: var(--serif); font-size: 28px; font-weight: 400; }
    .section-head .line { flex: 1; height: 1px; background: var(--border); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 80px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      transition: all .35s cubic-bezier(.22, 1, .36, 1);
      position: relative;
    }
    .card:hover { transform: translateY(-5px); border-color: var(--border-bright); box-shadow: 0 24px 64px -12px rgba(0,0,0,0.5); }

    .card h3 { font-family: var(--mono); font-size: 12px; color: var(--amber); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 20px; }
    .card-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
    .card-desc { font-size: 14px; color: var(--muted); margin-bottom: 24px; }

    .download-list { display: flex; flex-direction: column; gap: 12px; }
    .download-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 18px; background: rgba(255,255,255,0.02);
      border: 1px solid var(--border); border-radius: 10px;
      font-family: var(--mono); font-size: 13px;
    }
    .download-item span { color: var(--muted); }
    .download-item a { color: var(--amber); font-weight: 500; }
    .download-item a:hover { color: var(--cream); }

    .note { margin-top: 24px; font-size: 13px; color: var(--muted); font-style: italic; border-left: 2px solid var(--border); padding-left: 16px; }

    /* Project Card specific styles (from index.html) */
    .project-card h3 { /* Override generic card h3 for project titles */
      font-family: var(--mono);
      font-size: 16px;
      margin-bottom: 10px;
      color: var(--amber);
      text-transform: none; /* Remove uppercase */
      letter-spacing: normal;
    }
    .project-card p { /* Override generic card-desc for project descriptions */
      font-size: 14px;
      color: var(--muted);
      line-height: 1.65;
    }
    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      transition: color .25s;
    }
    .project-link:hover { color: var(--amber); }
    .project-link .arrow {
      transition: transform .25s;
      display: inline-block;
    }
    .project-link:hover .arrow { transform: translateX(4px); }

    /* Loading text for dynamic content */
    .loading-text {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      grid-column: 1/-1; /* Span full width in grid */
      padding: 40px 0;
      text-align: center;
    }
    .loading-text::after {
      content:'';
      animation:ellipsis 1.5s steps(4) infinite;
    }
    @keyframes ellipsis{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}

    footer { padding: 40px 0; border-top: 1px solid var(--border); text-align: center; }
    footer p { font-family: var(--mono); font-size: 12px; color: var(--muted); }

    @media (max-width: 768px) {
      .hero { padding: 60px 0 40px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">Aswanidev vs</a>
      <div class="nav-links">
        <a href="index.html">← Portfolio</a>
        <a href="https://github.com/Aswanidev-vs" target="_blank">GitHub</a>
      </div>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-content">
      <h1>My <em>Projects</em></h1>
      <p>Explore my open-source tools and applications.</p>
    </div>
  </section>

  <div id="dynamic-downloads"></div>

  <section>
    <div class="section-head">
      <h2>Other Projects</h2>
      <span class="line"></span>
    </div>
    <div id="github-projects" class="grid">
      <p class="loading-text">fetching repositories...</p>
    </div>
  </section>
</div>

<footer>
  <div class="container">
    <p>© 2025 Aswanidev VS · Built with Go & Minimalist CSS</p>
  </div>
</footer>

<script>
  const username = 'Aswanidev-vs';

  // Configuration: Just enter the names of projects you want to show binary downloads for
  const downloadableRepos = ['WriteDown', 'GitScope'];
  
  // Configuration: Names of projects to show in the "Other Projects" grid (standard repo link)
  const otherRepos = ['Akashic', 'Persona', 'Flowmark'];

  // Global handler for Android download confirmation
  window.confirmAndroid = (e) => {
    e.preventDefault();
    if (confirm("Android Installation:\n\n1. Ensure Termux is installed via F-Droid\n2. Run 'chmod +x <binary>'\n3. Execute via './<binary>'\n\nContinue download?")) {
      window.location.href = e.currentTarget.href;
    }
  };

  (async function init() {
    const downloadTarget = document.getElementById('dynamic-downloads');
    const projectsTarget = document.getElementById('github-projects');

    try {
      const res = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`);
      const repos = await res.json();

      // 1. Process Featured Downloadable Projects
      for (const name of downloadableRepos) {
        const repo = repos.find(r => r.name === name);
        if (!repo) continue;

        // Fetch latest release to get binary assets (.exe, etc)
        const releaseRes = await fetch(`https://api.github.com/repos/${username}/${name}/releases/latest`);
        const release = releaseRes.ok ? await releaseRes.json() : null;
        
        const section = document.createElement('section');
        section.innerHTML = `
          <div class="section-head">
            <h2>${repo.name}</h2>
            <span class="line"></span>
          </div>
          <div class="grid">
            <div class="card">
              <h3>Binaries</h3>
              <p class="card-title">Prebuilt Executables</p>
              <p class="card-desc">${release ? `Stable Version: ${release.tag_name}` : 'No releases found.'}</p>
              <div class="download-list">
                ${release ? release.assets.map(asset => {
                  const isExe = asset.name.toLowerCase().endsWith('.exe');
                  const isAndroid = asset.name.toLowerCase().includes('android') || asset.name.toLowerCase().includes('termux');
                  const typeLabel = isExe ? 'Windows x64' : (isAndroid ? 'Android (Termux)' : 'Linux / Unix');
                  const attr = isAndroid ? 'onclick="confirmAndroid(event)"' : '';
                  
                  return `
                    <div class="download-item">
                      <span>${typeLabel}</span>
                      <a href="${asset.browser_download_url}" ${attr}>Download</a>
                    </div>
                  `;
                }).join('') : '<p class="card-desc">No binary assets found in the latest release.</p>'}
              </div>
              ${release && release.assets.some(a => a.name.toLowerCase().includes('android')) ? 
                '<div class="note">Android: Requires Termux from F-Droid.</div>' : ''}
            </div>
            
            <div class="card">
              <h3>Source</h3>
              <p class="card-title">Development</p>
              <p class="card-desc">Fully open-source codebase for local building.</p>
              <div class="download-list">
                <div class="download-item">
                  <span>Main Branch</span>
                  <a href="${repo.html_url}" target="_blank">View on GitHub</a>
                </div>
              </div>
              <div class="note" style="font-family: var(--mono); font-size: 11px; margin-top: 30px;">
                $ go install github.com/${username.toLowerCase()}/${repo.name.toLowerCase()}@latest
              </div>
            </div>
          </div>
        `;
        downloadTarget.appendChild(section);
      }

      // 2. Process Secondary Projects Grid
      projectsTarget.innerHTML = '';
      const others = repos.filter(r => otherRepos.includes(r.name));
      others.forEach((repo, i) => {
        const card = document.createElement('div');
        card.className = 'card project-card';
        card.style.opacity = '0';
        card.style.animation = `fadeUp .5s ease forwards ${i * 0.1}s`;
        card.innerHTML = `
          <h3>${repo.name}</h3>
          <p>${repo.description || 'No description provided.'}</p>
          <a class="project-link" href="${repo.html_url}" target="_blank">
            View repository <span class="arrow">&rarr;</span>
          </a>
        `;
        projectsTarget.appendChild(card);
      });

    } catch (err) {
      console.error("Initialization error:", err);
      projectsTarget.innerHTML = `<p class="loading-text">Error fetching project data.</p>`;
    }
  })();
</script>

</body>
</html>
