<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aswanidev VS | Projects</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0d0b;
      --surface: #111411;
      --border: #1c201c;
      --text: #e2e0d8;
      --muted: #707568;
      --accent: #70ba00;
      --accent-dim: #5a9600;
      --accent-soft: rgba(112, 186, 0, 0.08);
      --mono: 'IBM Plex Mono', 'Fira Code', monospace;
      --sans: 'Manrope', system-ui, -apple-system, sans-serif;
      --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 180px 180px;
    }

    a { color: inherit; text-decoration: none; transition: all 0.25s ease }

    .scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      background: var(--accent);
      width: 0%;
      z-index: 10000;
      transition: width 0.1s linear;
    }

    .container { max-width: 880px; margin: 0 auto; padding: 0 clamp(24px, 6vw, 56px) }

    nav { padding: 28px 0 }
    .nav-inner { display: flex; justify-content: space-between; align-items: center }
    .logo {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 15px;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .nav-links { display: flex; gap: 32px; font-size: 13px; color: var(--muted) }
    .nav-links a:hover { color: var(--text) }

    .hero {
      padding: clamp(80px, 12vw, 130px) 0 clamp(50px, 8vw, 80px);
    }
    .hero h1 {
      font-family: var(--serif);
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 400;
      line-height: 1.0;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .hero h1 em { font-style: italic; color: var(--accent) }
    .hero p { color: var(--muted); max-width: 460px; font-size: 16px; line-height: 1.8 }

    .section-head {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 32px;
    }
    .section-head h2 {
      font-family: var(--serif);
      font-size: clamp(24px, 3.5vw, 30px);
      font-weight: 400;
      letter-spacing: -0.01em;
    }
    .section-head .line { flex: 1; height: 1px; background: var(--border) }

    /* ── Download Cards ── */
    .download-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: clamp(56px, 8vw, 96px);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px;
      transition: border-color 0.3s ease;
    }
    .card:hover { border-color: var(--muted) }

    .card-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 22px;
      line-height: 1.6;
    }

    .download-list { display: flex; flex-direction: column; gap: 10px }
    .download-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255,255,255,0.015);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 13px;
    }
    .download-item span { color: var(--muted) }
    .download-item a { color: var(--accent); font-weight: 500 }
    .download-item a:hover { color: var(--text) }

    .install-cmd {
      margin-top: 20px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
      font-style: italic;
      border-left: 2px solid var(--border);
      padding-left: 14px;
    }

    /* ── Project List (vertical rows) ── */
    .project-list { display: flex; flex-direction: column }
    .project-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 22px 0;
      border-bottom: 1px solid var(--border);
      gap: 24px;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }
    .project-row::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--accent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .project-row:hover {
      background: var(--surface);
      padding-left: 16px;
    }
    .project-row:hover::before { opacity: 1 }
    .project-info { flex: 1; min-width: 0 }
    .project-name {
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .project-desc { font-size: 14px; color: var(--muted); line-height: 1.6 }
    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      transition: color 0.25s ease;
      white-space: nowrap;
      padding-top: 3px;
      flex-shrink: 0;
    }
    .project-link:hover { color: var(--accent) }
    .project-link .arrow { transition: transform 0.25s ease; display: inline-block }
    .project-link:hover .arrow { transform: translateX(4px) }

    /* ── Loading ── */
    .loading-text {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--muted);
      padding: 40px 0;
      text-align: center;
    }
    .loading-text::after { content: ''; animation: ellipsis 1.5s steps(4) infinite }
    @keyframes ellipsis {
      0% { content: '' }
      25% { content: '.' }
      50% { content: '..' }
      75% { content: '...' }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px) }
      to { opacity: 1; transform: translateY(0) }
    }

    /* ── Footer ── */
    footer {
      padding: 40px 0;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    footer p { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em }
    footer p span { color: var(--accent-dim) }

    /* ── Scroll Reveal ── */
    [data-reveal] {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    [data-reveal].revealed { opacity: 1; transform: translateY(0) }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .hero { padding: 60px 0 40px }
      .download-grid { grid-template-columns: 1fr }
      .project-row { flex-direction: column; gap: 10px }
      .project-link { padding-top: 0 }
      .project-row:hover { padding-left: 12px }
    }
  </style>
</head>
<body>

<div class="scroll-progress"></div>

<div class="container">
  <nav>
    <div class="nav-inner">
      <a href="index.html" class="logo">Aswanidevvs</a>
      <div class="nav-links">
        <a href="index.html">Portfolio</a>
        <a href="https://github.com/Aswanidev-vs" target="_blank">GitHub</a>
      </div>
    </div>
  </nav>

  <section class="hero">
    <h1>My <em>Projects</em></h1>
    <p>Explore my open-source tools and applications. Built with Go, designed for speed.</p>
  </section>

  <div id="dynamic-downloads"></div>

  <section data-reveal>
    <div class="section-head">
      <h2>Other Projects</h2>
      <span class="line"></span>
    </div>
    <div id="github-projects" class="project-list">
      <p class="loading-text">fetching repositories</p>
    </div>
  </section>
</div>

<footer>
  <div class="container">
    <p>&copy; 2026 <span>Aswanidev VS</span> &mdash; Code Build Learn Repeat</p>
  </div>
</footer>

<script>
(function() {
  var progress = document.querySelector('.scroll-progress');
  window.addEventListener('scroll', function() {
    var scrollTop = window.scrollY;
    var docHeight = document.documentElement.scrollHeight - window.innerHeight;
    var scrollPercent = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
    progress.style.width = scrollPercent + '%';
  }, { passive: true });

  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('revealed');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('[data-reveal]').forEach(function(el) {
    observer.observe(el);
  });

  var username = 'Aswanidev-vs';
  var downloadableRepos = ['WriteDown', 'GitScope'];
  var otherRepos = ['Akashic', 'Persona', 'Flowmark'];

  window.confirmAndroid = function(e) {
    e.preventDefault();
    if (confirm("Android Installation:\n\n1. Ensure Termux is installed via F-Droid\n2. Run 'chmod +x <binary>'\n3. Execute via './<binary>'\n\nContinue download?")) {
      window.location.href = e.currentTarget.href;
    }
  };

  (function init() {
    var downloadTarget = document.getElementById('dynamic-downloads');
    var projectsTarget = document.getElementById('github-projects');

    fetch('https://api.github.com/users/' + username + '/repos?per_page=100&sort=updated')
      .then(function(res) { return res.json(); })
      .then(function(repos) {

        var pending = downloadableRepos.length;
        if (pending === 0) processOthers();

        downloadableRepos.forEach(function(name) {
          var repo = repos.find(function(r) { return r.name === name; });
          if (!repo) { if (--pending === 0) processOthers(); return; }

          fetch('https://api.github.com/repos/' + username + '/' + name + '/releases/latest')
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(release) {

              var section = document.createElement('section');
              section.setAttribute('data-reveal', '');
              section.innerHTML =
                '<div class="section-head">' +
                  '<h2>' + repo.name + '</h2>' +
                  '<span class="line"></span>' +
                '</div>' +
                '<div class="download-grid">' +
                  '<div class="card">' +
                    '<div class="card-label">Binaries</div>' +
                    '<p class="card-title">Prebuilt Executables</p>' +
                    '<p class="card-desc">' + (release ? 'Stable Version: ' + release.tag_name : 'No releases found.') + '</p>' +
                    '<div class="download-list">' +
                      (release ? release.assets.map(function(asset) {
                        var isExe = asset.name.toLowerCase().endsWith('.exe');
                        var isAndroid = asset.name.toLowerCase().indexOf('android') !== -1 || asset.name.toLowerCase().indexOf('termux') !== -1;
                        var typeLabel = isExe ? 'Windows x64' : (isAndroid ? 'Android (Termux)' : 'Linux / Unix');
                        var attr = isAndroid ? 'onclick="confirmAndroid(event)"' : '';
                        return '<div class="download-item"><span>' + typeLabel + '</span><a href="' + asset.browser_download_url + '" ' + attr + '>Download</a></div>';
                      }).join('') : '<p class="card-desc">No binary assets found in the latest release.</p>') +
                    '</div>' +
                    (release && release.assets.some(function(a) { return a.name.toLowerCase().indexOf('android') !== -1; }) ?
                      '<div class="note">Android: Requires Termux from F-Droid.</div>' : '') +
                  '</div>' +
                  '<div class="card">' +
                    '<div class="card-label">Source</div>' +
                    '<p class="card-title">Development</p>' +
                    '<p class="card-desc">Fully open-source codebase for local building.</p>' +
                    '<div class="download-list">' +
                      '<div class="download-item"><span>Main Branch</span><a href="' + repo.html_url + '" target="_blank">View on GitHub</a></div>' +
                    '</div>' +
                    '<div class="install-cmd">$ go install github.com/' + username.toLowerCase() + '/' + repo.name.toLowerCase() + '@latest</div>' +
                  '</div>' +
                '</div>';
              downloadTarget.appendChild(section);

              observer.observe(section);
              if (--pending === 0) processOthers();
            })
            .catch(function() { if (--pending === 0) processOthers(); });
        });

        function processOthers() {
          projectsTarget.innerHTML = '';
          var others = repos.filter(function(r) { return otherRepos.indexOf(r.name) !== -1; });
          if (!others.length) {
            projectsTarget.innerHTML = '<p class="loading-text">No other projects found</p>';
            return;
          }
          others.forEach(function(repo, i) {
            var row = document.createElement('div');
            row.className = 'project-row';
            row.style.opacity = '0';
            row.style.animation = 'fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards ' + (i * 0.08) + 's';
            row.innerHTML =
              '<div class="project-info">' +
                '<div class="project-name">' + repo.name + '</div>' +
                '<div class="project-desc">' + (repo.description || 'No description provided.') + '</div>' +
              '</div>' +
              '<a class="project-link" href="' + repo.html_url + '" target="_blank">' +
                'View repo <span class="arrow">&rarr;</span>' +
              '</a>';
            projectsTarget.appendChild(row);
          });
        }

      })
      .catch(function() {
        projectsTarget.innerHTML = '<p class="loading-text">Error fetching project data.</p>';
      });
  })();
})();
</script>

</body>
</html>
